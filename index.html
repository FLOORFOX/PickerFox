<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PickerFox Demo</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --panel: #ffffff;
        --panel-soft: #eef4ff;
        --text: #142033;
        --muted: #58657d;
        --primary: #0f5bd8;
        --primary-soft: rgba(15, 91, 216, 0.12);
        --danger: #e53935;
        --danger-soft: rgba(229, 57, 53, 0.16);
        --neutral: #dfe6f3;
        --shadow: 0 14px 30px rgba(28, 39, 58, 0.12);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #edf3ff 0%, #f7f9fd 100%);
        color: var(--text);
      }

      body {
        display: flex;
        justify-content: center;
        padding: 20px;
      }

      .app {
        width: min(1100px, 100%);
        background: rgba(255,255,255,0.75);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(21, 49, 87, 0.08);
        border-radius: 22px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 22px;
        background: linear-gradient(135deg, #0e4ebd 0%, #144bb4 100%);
        color: #fff;
      }

      .brand {
        font-size: clamp(1.15rem, 2vw, 1.8rem);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .brand small {
        display: block;
        font-size: 0.7rem;
        color: rgba(255,255,255,0.8);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-top: 4px;
      }

      .demo-label {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.22);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .content {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
      }

      .sidebar {
        background: var(--panel);
        padding: 20px 18px;
        border-right: 1px solid rgba(20, 32, 51, 0.08);
      }

      .search-card {
        background: var(--panel-soft);
        border: 1px solid rgba(15, 91, 216, 0.12);
        border-radius: 16px;
        padding: 16px;
      }

      label {
        display: block;
        font-size: 0.9rem;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--text);
      }

      .input-wrap {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      select {
        width: 100%;
        min-height: 46px;
        border-radius: 12px;
        border: 1px solid rgba(20, 32, 51, 0.18);
        padding: 10px 12px;
        font-size: 1rem;
        color: var(--text);
        background: #fff;
      }

      select:focus {
        outline: 3px solid rgba(15, 91, 216, 0.18);
        border-color: var(--primary);
      }

      .clear-btn {
        appearance: none;
        border: none;
        background: var(--neutral);
        color: var(--text);
        padding: 10px 14px;
        font-weight: 700;
        border-radius: 10px;
        cursor: pointer;
      }

      .result-card {
        margin-top: 18px;
        background: var(--panel);
        border: 1px solid rgba(20, 32, 51, 0.08);
        border-radius: 16px;
        padding: 16px;
      }

      .status {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .result {
        margin-top: 10px;
        display: grid;
        gap: 8px;
      }

      .result strong {
        font-size: 1.5rem;
      }

      .result .meta {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .map-panel {
        background: linear-gradient(180deg, #f8fafd 0%, #edf5ff 100%);
        padding: 18px;
      }

      .map-shell {
        position: relative;
        width: 100%;
        height: min(75vh, 760px);
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(20, 32, 51, 0.1);
        background: #fff;
      }

      .map-shell img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #fff;
      }

      .pallet-layer {
        position: absolute;
        inset: 0;
      }

      .pallet {
        position: absolute;
        width: 24px;
        height: 18px;
        border-radius: 4px;
        border: 2px solid rgba(44, 50, 58, 0.6);
        background: #d8dfe8;
        transform: translate(-50%, -50%);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4);
        transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      }

      .pallet::after {
        content: attr(data-number);
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 8px;
        font-weight: 700;
        color: rgba(18, 27, 39, 0.8);
      }

      .pallet.selected {
        background: var(--danger);
        border-color: rgba(102, 14, 13, 0.9);
        box-shadow: 0 0 0 5px rgba(229,57,53,0.18), 0 0 18px rgba(229,57,53,0.56);
        transform: translate(-50%, -50%) scale(1.22);
      }

      .pallet.selected::after {
        color: #fff;
      }

      @media (max-width: 820px) {
        .content {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid rgba(20, 32, 51, 0.08);
        }

        .map-shell {
          height: 62vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="brand">
          PickerFox
          <small>Warehouse picker demo</small>
        </div>
        <div class="demo-label">Early version</div>
      </div>

      <div class="content">
        <aside class="sidebar">
          <div class="search-card">
            <label for="palletSelect">Which pallet number are you looking for?</label>
            <div class="input-wrap">
              <select id="palletSelect">
                <option value="">Choose a pallet</option>
              </select>
              <button class="clear-btn" id="clearBtn" type="button">Clear</button>
            </div>
          </div>

          <div class="result-card">
            <div id="status" class="status">No pallet selected</div>
            <div id="result" class="result">
              <div class="meta">Select a pallet number to highlight it on the map.</div>
            </div>
          </div>
        </aside>

        <main class="map-panel">
          <div class="map-shell">
            <img src="./floorplan_racks_pallets.svg" alt="Warehouse floorplan" />
            <div id="palletLayer" class="pallet-layer" aria-live="polite"></div>
          </div>
        </main>
      </div>
    </div>

    <script>
      const palletMap = [
        { number: 1, pallet: 'P-01', x: 18, y: 28 },
        { number: 2, pallet: 'P-02', x: 34, y: 22 },
        { number: 3, pallet: 'P-03', x: 51, y: 26 },
        { number: 4, pallet: 'P-04', x: 64, y: 25 },
        { number: 5, pallet: 'P-05', x: 77, y: 28 },
        { number: 6, pallet: 'P-06', x: 25, y: 49 },
        { number: 7, pallet: 'P-07', x: 39, y: 45 },
        { number: 8, pallet: 'P-08', x: 56, y: 50 },
        { number: 9, pallet: 'P-09', x: 73, y: 47 },
        { number: 10, pallet: 'P-10', x: 86, y: 49 },
        { number: 11, pallet: 'P-11', x: 18, y: 68 },
        { number: 12, pallet: 'P-12', x: 32, y: 71 },
        { number: 13, pallet: 'P-13', x: 48, y: 72 },
        { number: 14, pallet: 'P-14', x: 63, y: 71 },
        { number: 15, pallet: 'P-15', x: 79, y: 68 },
        { number: 16, pallet: 'P-16', x: 20, y: 84 },
        { number: 17, pallet: 'P-17', x: 35, y: 86 },
        { number: 18, pallet: 'P-18', x: 52, y: 85 },
        { number: 19, pallet: 'P-19', x: 67, y: 84 },
        { number: 20, pallet: 'P-20', x: 81, y: 86 },
        { number: 21, pallet: 'P-21', x: 91, y: 18 }
      ];

      const palletLookup = new Map(palletMap.map(item => [item.number, item]));

      const select = document.getElementById('palletSelect');
      const result = document.getElementById('result');
      const status = document.getElementById('status');
      const palletLayer = document.getElementById('palletLayer');
      const clearBtn = document.getElementById('clearBtn');

      function buildPalletOptions() {
        palletMap.forEach((entry) => {
          const option = document.createElement('option');
          option.value = String(entry.number);
          option.textContent = `Pallet ${entry.number}`;
          select.appendChild(option);
        });
      }

      function createPalletMarkers() {
        palletMap.forEach((entry) => {
          const marker = document.createElement('div');
          marker.className = 'pallet';
          marker.dataset.number = String(entry.number);
          marker.dataset.pallet = entry.pallet;
          marker.style.left = `${entry.x}%`;
          marker.style.top = `${entry.y}%`;
          marker.title = `Pallet ${entry.number} / ${entry.pallet}`;
          palletLayer.appendChild(marker);
        });
      }

      function setSelection(selectedNumber) {
        const markers = [...document.querySelectorAll('.pallet')];
        const selected = markers.find((marker) => Number(marker.dataset.number) === Number(selectedNumber));

        markers.forEach((marker) => marker.classList.remove('selected'));

        if (!selected) {
          status.textContent = 'No pallet selected';
          result.className = 'result';
          result.innerHTML = '<div class="meta">Select a pallet number to highlight it on the map.</div>';
          return;
        }

        selected.classList.add('selected');

        const item = palletLookup.get(Number(selectedNumber));
        status.textContent = 'Pallet found';
        result.className = 'result';
        result.innerHTML = `
          <div><strong>Pallet ${item.number}</strong></div>
          <div class="meta">Code: ${item.pallet}</div>
          <div class="meta">Location: highlighted on the floorplan</div>
        `;
      }

      select.addEventListener('change', (event) => {
        const value = event.target.value;
        if (!value) {
          document.querySelectorAll('.pallet').forEach((el) => el.classList.remove('selected'));
          status.textContent = 'No pallet selected';
          result.className = 'result';
          result.innerHTML = '<div class="meta">Select a pallet number to highlight it on the map.</div>';
          return;
        }

        setSelection(Number(value));
      });

      clearBtn.addEventListener('click', () => {
        select.value = '';
        document.querySelectorAll('.pallet').forEach((el) => el.classList.remove('selected'));
        status.textContent = 'No pallet selected';
        result.className = 'result';
        result.innerHTML = '<div class="meta">Select a pallet number to highlight it on the map.</div>';
      });

      buildPalletOptions();
      createPalletMarkers();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PickerFox Demo</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --panel: #ffffff;
        --panel-soft: #eef4ff;
        --text: #142033;
        --muted: #58657d;
        --primary: #0f5bd8;
        --danger: #e53935;
        --neutral: #dfe6f3;
        --shadow: 0 14px 30px rgba(28, 39, 58, 0.12);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #edf3ff 0%, #f7f9fd 100%);
        color: var(--text);
      }

      body {
        display: flex;
        justify-content: center;
        padding: 20px;
      }

      .app {
        width: min(1100px, 100%);
        background: rgba(255,255,255,0.75);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(21, 49, 87, 0.08);
        border-radius: 22px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 22px;
        background: linear-gradient(135deg, #0e4ebd 0%, #144bb4 100%);
        color: #fff;
      }

      .brand {
        font-size: clamp(1.15rem, 2vw, 1.8rem);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .brand small {
        display: block;
        font-size: 0.7rem;
        color: rgba(255,255,255,0.8);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-top: 4px;
      }

      .demo-label {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.22);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .content {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
      }

      .sidebar {
        background: var(--panel);
        padding: 20px 18px;
        border-right: 1px solid rgba(20, 32, 51, 0.08);
      }

      .search-card {
        background: var(--panel-soft);
        border: 1px solid rgba(15, 91, 216, 0.12);
        border-radius: 16px;
        padding: 16px;
      }

      label {
        display: block;
        font-size: 0.9rem;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--text);
      }

      input {
        width: 100%;
        min-height: 46px;
        border-radius: 12px;
        border: 1px solid rgba(20, 32, 51, 0.18);
        padding: 10px 12px;
        font-size: 1rem;
        color: var(--text);
        background: #fff;
      }

      input:focus {
        outline: 3px solid rgba(15, 91, 216, 0.18);
        border-color: var(--primary);
      }

      .map-panel {
        background: linear-gradient(180deg, #f8fafd 0%, #edf5ff 100%);
        padding: 18px;
      }

      .map-shell {
        position: relative;
        width: 100%;
        height: min(75vh, 760px);
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(20, 32, 51, 0.1);
        background: #fff;
      }

      .map-shell img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #fff;
      }

      .search-hint {
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.5;
      }

      @media (max-width: 820px) {
        .content {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid rgba(20, 32, 51, 0.08);
        }

        .map-shell {
          height: 62vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="brand">
          PickerFox
          <small>Warehouse picker demo</small>
        </div>
        <div class="demo-label">Floorplan</div>
      </div>

      <div class="content">
        <aside class="sidebar">
          <div class="search-card">
            <label for="searchInput">Find a location</label>
            <input id="searchInput" type="text" placeholder="Search aisle, rack or zone" />
            <div class="search-hint">
              This demo focuses on the warehouse map and the search field only.
            </div>
          </div>
        </aside>

        <main class="map-panel">
          <div class="map-shell">
            <img src="./floorplan_racks_pallets.svg" alt="Warehouse floorplan" />
          </div>
        </main>
      </div>
    </div>

    <script>
      const input = document.getElementById('searchInput');

      input.addEventListener('input', () => {
        const value = input.value.trim();
        input.style.borderColor = value ? '#0f5bd8' : 'rgba(20, 32, 51, 0.18)';
      });
    </script>
  </body>
</html>

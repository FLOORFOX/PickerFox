<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PickerFox Demo</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --panel: #ffffff;
        --panel-soft: #eef4ff;
        --text: #142033;
        --muted: #58657d;
        --primary: #0f5bd8;
        --primary-soft: rgba(15, 91, 216, 0.12);
        --danger: #e53935;
        --danger-soft: rgba(229, 57, 53, 0.16);
        --neutral: #dfe6f3;
        --shadow: 0 14px 30px rgba(28, 39, 58, 0.12);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #edf3ff 0%, #f7f9fd 100%);
        color: var(--text);
      }

      body {
        display: flex;
        justify-content: center;
        padding: 20px;
      }

      .app {
        width: min(1100px, 100%);
        background: rgba(255,255,255,0.75);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(21, 49, 87, 0.08);
        border-radius: 22px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 22px;
        background: linear-gradient(135deg, #0e4ebd 0%, #144bb4 100%);
        color: #fff;
      }

      .brand {
        font-size: clamp(1.15rem, 2vw, 1.8rem);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .brand small {
        display: block;
        font-size: 0.7rem;
        color: rgba(255,255,255,0.8);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-top: 4px;
      }

      .demo-label {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.22);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .content {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
      }

      .sidebar {
        background: var(--panel);
        padding: 20px 18px;
        border-right: 1px solid rgba(20, 32, 51, 0.08);
      }

      .search-card {
        background: var(--panel-soft);
        border: 1px solid rgba(15, 91, 216, 0.12);
        border-radius: 16px;
        padding: 16px;
      }

      label {
        display: block;
        font-size: 0.9rem;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--text);
      }

      .input-wrap {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      input, select {
        width: 100%;
        min-height: 46px;
        border-radius: 12px;
        border: 1px solid rgba(20, 32, 51, 0.18);
        padding: 10px 12px;
        font-size: 1rem;
        color: var(--text);
        background: #fff;
      }

      input:focus, select:focus {
        outline: 3px solid rgba(15, 91, 216, 0.18);
        border-color: var(--primary);
      }

      .clear-btn {
        appearance: none;
        border: none;
        background: var(--neutral);
        color: var(--text);
        padding: 10px 14px;
        font-weight: 700;
        border-radius: 10px;
        cursor: pointer;
      }

      .result-card {
        margin-top: 18px;
        background: var(--panel);
        border: 1px solid rgba(20, 32, 51, 0.08);
        border-radius: 16px;
        padding: 16px;
      }

      .status {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .result {
        margin-top: 10px;
        display: grid;
        gap: 8px;
      }

      .result strong {
        font-size: 1.5rem;
      }

      .result .meta {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .result.not-found {
        background: var(--danger-soft);
        border: 1px solid rgba(229,57,53,0.18);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .map-panel {
        background: linear-gradient(180deg, #f8fafd 0%, #edf5ff 100%);
        padding: 18px;
      }

      .map-shell {
        position: relative;
        width: 100%;
        height: min(75vh, 760px);
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(20, 32, 51, 0.1);
        background: #fff;
      }

      .map-shell img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #fff;
      }

      .pallet-layer {
        position: absolute;
        inset: 0;
      }

      .pallet {
        position: absolute;
        width: 24px;
        height: 18px;
        border-radius: 4px;
        border: 2px solid rgba(44, 50, 58, 0.6);
        background: #d8dfe8;
        transform: translate(-50%, -50%);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.4);
        transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      }

      .pallet::after {
        content: attr(data-code);
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 8px;
        font-weight: 700;
        color: rgba(18, 27, 39, 0.8);
      }

      .pallet.selected {
        background: var(--danger);
        border-color: rgba(102, 14, 13, 0.9);
        box-shadow: 0 0 0 5px rgba(229,57,53,0.18), 0 0 18px rgba(229,57,53,0.56);
        transform: translate(-50%, -50%) scale(1.22);
      }

      .pallet.selected::after {
        color: #fff;
      }

      @media (max-width: 820px) {
        .content {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid rgba(20, 32, 51, 0.08);
        }

        .map-shell {
          height: 62vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="brand">
          PickerFox
          <small>Warehouse picker demo</small>
        </div>
        <div class="demo-label">Early version</div>
      </div>

      <div class="content">
        <aside class="sidebar">
          <div class="search-card">
            <label for="productInput">What product are you looking for?</label>
            <div class="input-wrap">
              <input
                id="productInput"
                type="number"
                min="0"
                max="100"
                step="1"
                placeholder="Type a product number"
                list="productOptions"
              />
              <datalist id="productOptions"></datalist>
              <button class="clear-btn" id="clearBtn" type="button">Clear</button>
            </div>
          </div>

          <div class="result-card">
            <div id="status" class="status">No product selected</div>
            <div id="result" class="result">
              <div class="meta">Select a product number to highlight its pallet.</div>
            </div>
          </div>
        </aside>

        <main class="map-panel">
          <div class="map-shell">
            <img src="./floorplan_racks_pallets.svg" alt="Warehouse floorplan" />
            <div id="palletLayer" class="pallet-layer" aria-live="polite"></div>
          </div>
        </main>
      </div>
    </div>

    <script>
      const maxProductNumber = 100;
      const productMap = [];
      const productLookup = new Map(productMap.map(item => [item.product, item]));

      const input = document.getElementById('productInput');
      const datalist = document.getElementById('productOptions');
      const result = document.getElementById('result');
      const status = document.getElementById('status');
      const palletLayer = document.getElementById('palletLayer');
      const clearBtn = document.getElementById('clearBtn');

      function buildDatalist() {
        datalist.innerHTML = '';
      }

      function createPalletMarkers() {
        palletLayer.innerHTML = '';
      }

      function setSelection(productNumber) {
        const markers = [...document.querySelectorAll('.pallet')];
        const selected = markers.find((marker) => Number(marker.dataset.product) === Number(productNumber));

        markers.forEach((marker) => marker.classList.remove('selected'));

        if (!selected) {
          status.textContent = 'No match found';
          result.className = 'result not-found';
          result.innerHTML = `
            <div><strong>Product ${productNumber}</strong></div>
            <div class="meta">No pallet is assigned to this product in the demo.</div>
          `;
          return;
        }

        selected.classList.add('selected');

        const item = productLookup.get(Number(productNumber));
        status.textContent = 'Product found';
        result.className = 'result';
        result.innerHTML = `
          <div><strong>${item.product}</strong></div>
          <div class="meta">Pallet: ${item.pallet}</div>
          <div class="meta">Location: highlighted on the floorplan</div>
        `;
      }

      function handleSearch() {
        const value = Number(input.value);
        if (!Number.isInteger(value) || value < 0 || value > maxProductNumber) {
          status.textContent = 'No product selected';
          result.className = 'result';
          result.innerHTML = '<div class="meta">Select a product number to highlight its pallet.</div>';
          return;
        }
        setSelection(value);
      }

      input.addEventListener('change', handleSearch);
      input.addEventListener('input', () => {
        if (input.value === '') {
          status.textContent = 'No product selected';
          result.className = 'result';
          result.innerHTML = '<div class="meta">Select a product number to highlight its pallet.</div>';
          document.querySelectorAll('.pallet').forEach((el) => el.classList.remove('selected'));
        }
      });

      clearBtn.addEventListener('click', () => {
        input.value = '';
        document.querySelectorAll('.pallet').forEach((el) => el.classList.remove('selected'));
        status.textContent = 'No product selected';
        result.className = 'result';
        result.innerHTML = '<div class="meta">Select a product number to highlight its pallet.</div>';
      });

      buildDatalist();
      createPalletMarkers();
    </script>
  </body>
</html>

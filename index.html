<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PickerFox Demo</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --panel: #ffffff;
        --panel-soft: #eef4ff;
        --text: #142033;
        --muted: #58657d;
        --primary: #0f5bd8;
        --primary-soft: rgba(15, 91, 216, 0.12);
        --danger: #e53935;
        --danger-soft: rgba(229, 57, 53, 0.16);
        --neutral: #dfe6f3;
        --shadow: 0 14px 30px rgba(28, 39, 58, 0.12);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #edf3ff 0%, #f7f9fd 100%);
        color: var(--text);
      }

      body {
        display: flex;
        justify-content: center;
        padding: 20px;
      }

      .app {
        width: min(1100px, 100%);
        background: rgba(255,255,255,0.75);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(21, 49, 87, 0.08);
        border-radius: 22px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 22px;
        background: linear-gradient(135deg, #0e4ebd 0%, #144bb4 100%);
        color: #fff;
      }

      .brand {
        font-size: clamp(1.15rem, 2vw, 1.8rem);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .brand small {
        display: block;
        font-size: 0.7rem;
        color: rgba(255,255,255,0.8);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-top: 4px;
      }

      .demo-label {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.22);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .content {
        display: grid;
        grid-template-columns: 330px minmax(0, 1fr);
      }

      .sidebar {
        background: var(--panel);
        padding: 20px 18px;
        border-right: 1px solid rgba(20, 32, 51, 0.08);
      }

      .search-card {
        background: var(--panel-soft);
        border: 1px solid rgba(15, 91, 216, 0.12);
        border-radius: 16px;
        padding: 16px;
      }

      label {
        display: block;
        font-size: 0.9rem;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--text);
      }

      .input-wrap {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      input, select {
        width: 100%;
        min-height: 46px;
        border-radius: 12px;
        border: 1px solid rgba(20, 32, 51, 0.18);
        padding: 10px 12px;
        font-size: 1rem;
        color: var(--text);
        background: #fff;
      }

      input:focus, select:focus {
        outline: 3px solid rgba(15, 91, 216, 0.18);
        border-color: var(--primary);
      }

      .clear-btn {
        appearance: none;
        border: none;
        background: var(--neutral);
        color: var(--text);
        padding: 10px 14px;
        font-weight: 700;
        border-radius: 10px;
        cursor: pointer;
      }

      .result-card {
        margin-top: 18px;
        background: var(--panel);
        border: 1px solid rgba(20, 32, 51, 0.08);
        border-radius: 16px;
        padding: 16px;
      }

      .status {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .result {
        margin-top: 10px;
        display: grid;
        gap: 8px;
      }

      .result strong {
        font-size: 1.5rem;
      }

      .result .meta {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .result.not-found {
        background: var(--danger-soft);
        border: 1px solid rgba(229,57,53,0.18);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .map-panel {
        background: linear-gradient(180deg, #f8fafd 0%, #edf5ff 100%);
        padding: 18px;
      }

      .map-shell {
        position: relative;
        width: 100%;
        height: min(75vh, 760px);
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid rgba(20, 32, 51, 0.1);
        background: #fff;
      }

      #warehouseSvg {
        display: block;
        width: 100%;
        height: 100%;
        background: #fff;
      }

      .map-shell svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      @media (max-width: 820px) {
        .content {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: none;
          border-bottom: 1px solid rgba(20, 32, 51, 0.08);
        }

        .map-shell {
          height: 62vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <div class="brand">
          PickerFox
          <small>Warehouse picker demo</small>
        </div>
        <div class="demo-label">Real SVG map</div>
      </div>

      <div class="content">
        <aside class="sidebar">
          <div class="search-card">
            <label for="productInput">What product are you looking for?</label>
            <div class="input-wrap">
              <input
                id="productInput"
                type="number"
                min="1"
                max="100"
                step="1"
                placeholder="Type a product number"
                list="productOptions"
              />
              <datalist id="productOptions"></datalist>
              <button class="clear-btn" id="clearBtn" type="button">Clear</button>
            </div>
          </div>

          <div class="result-card">
            <div id="status" class="status">No product selected</div>
            <div id="result" class="result">
              <div class="meta">Select a product number to highlight its pallet on the warehouse map.</div>
            </div>
          </div>
        </aside>

        <main class="map-panel">
          <div class="map-shell">
            <object id="warehouseSvg" data="./floorplan_racks_pallets.svg" type="image/svg+xml" title="Warehouse floorplan"></object>
          </div>
        </main>
      </div>
    </div>

    <script>
      const svgNS = 'http://www.w3.org/2000/svg';
      const input = document.getElementById('productInput');
      const datalist = document.getElementById('productOptions');
      const result = document.getElementById('result');
      const status = document.getElementById('status');
      const clearBtn = document.getElementById('clearBtn');
      const warehouseSvg = document.getElementById('warehouseSvg');

      const catalog = [
        { product: 3, sku: 'SKU-003', location: 'A-03' },
        { product: 8, sku: 'SKU-008', location: 'A-08' },
        { product: 12, sku: 'SKU-012', location: 'B-12' },
        { product: 16, sku: 'SKU-016', location: 'B-16' },
        { product: 19, sku: 'SKU-019', location: 'C-19' },
        { product: 23, sku: 'SKU-023', location: 'C-23' },
        { product: 27, sku: 'SKU-027', location: 'D-27' },
        { product: 31, sku: 'SKU-031', location: 'D-31' },
        { product: 35, sku: 'SKU-035', location: 'E-35' },
        { product: 39, sku: 'SKU-039', location: 'E-39' },
        { product: 42, sku: 'SKU-042', location: 'F-42' },
        { product: 47, sku: 'SKU-047', location: 'F-47' },
        { product: 52, sku: 'SKU-052', location: 'G-52' },
        { product: 57, sku: 'SKU-057', location: 'G-57' },
        { product: 63, sku: 'SKU-063', location: 'H-63' },
        { product: 68, sku: 'SKU-068', location: 'H-68' },
        { product: 73, sku: 'SKU-073', location: 'I-73' },
        { product: 79, sku: 'SKU-079', location: 'I-79' },
        { product: 84, sku: 'SKU-084', location: 'J-84' },
        { product: 91, sku: 'SKU-091', location: 'J-91' }
      ];

      const productLookup = new Map(catalog.map(item => [item.product, item]));
      let palletGroups = [];

      function buildDatalist() {
        datalist.innerHTML = '';
        for (let i = 1; i <= 100; i += 1) {
          const option = document.createElement('option');
          option.value = String(i);
          datalist.appendChild(option);
        }
      }

      function resetSelectionVisuals() {
        palletGroups.forEach((group) => {
          const label = group.querySelector('text[data-pickerfox-label]');

          group.style.filter = '';
          group.style.opacity = '1';
          group.setAttribute('stroke', group.dataset.originalStroke || '#dad9f2');
          group.setAttribute('stroke-width', group.dataset.originalStrokeWidth || '1.5');
          group.setAttribute('fill', group.dataset.originalFill || 'none');

          if (label) {
            label.setAttribute('fill', '#2e3a4f');
            label.setAttribute('font-size', '0.28');
          }
        });
      }

      function setSelectedProduct(productNumber) {
        const selectedGroup = palletGroups.find(
          (group) => Number(group.dataset.pickerfoxProduct) === Number(productNumber)
        );

        resetSelectionVisuals();

        if (!selectedGroup) {
          status.textContent = 'No match found';
          result.className = 'result not-found';
          result.innerHTML = `
            <div><strong>Product ${productNumber}</strong></div>
            <div class="meta">No pallet is assigned to this product in the demo.</div>
          `;
          return;
        }

        const item = productLookup.get(Number(productNumber));

        palletGroups.forEach((group) => {
          const isMatch = group === selectedGroup;
          const label = group.querySelector('text[data-pickerfox-label]');

          group.style.filter = isMatch ? 'drop-shadow(0 0 12px rgba(229,57,53,0.85)) saturate(1.4)' : 'grayscale(0.2) opacity(0.4)';
          group.style.opacity = isMatch ? '1' : '0.4';
          group.setAttribute('stroke', isMatch ? '#d62828' : (group.dataset.originalStroke || '#dad9f2'));
          group.setAttribute('stroke-width', isMatch ? '3' : (group.dataset.originalStrokeWidth || '1.5'));
          group.setAttribute('fill', isMatch ? 'rgba(229,57,53,0.42)' : (group.dataset.originalFill || 'none'));

          if (label) {
            label.setAttribute('fill', isMatch ? '#ffffff' : '#2e3a4f');
            label.setAttribute('font-size', isMatch ? '0.3' : '0.28');
          }
        });

        status.textContent = 'Product found';
        result.className = 'result';
        result.innerHTML = `
          <div><strong>${item.product}</strong></div>
          <div class="meta">SKU: ${item.sku}</div>
          <div class="meta">Location: ${item.location}</div>
          <div class="meta">Pallet highlighted on the warehouse floorplan.</div>
        `;
      }

      function attachProductData() {
        const svgDoc = warehouseSvg.contentDocument;
        if (!svgDoc) return;

        const groups = Array.from(svgDoc.querySelectorAll('g[data-symbol="pallet"]'));

        groups.forEach((group, index) => {
          const item = catalog[index % catalog.length];

          group.dataset.pickerfoxProduct = String(item.product);
          group.dataset.pickerfoxSku = item.sku;
          group.dataset.pickerfoxLocation = item.location;
          group.dataset.originalStroke = group.getAttribute('stroke') || '#dad9f2';
          group.dataset.originalStrokeWidth = group.getAttribute('stroke-width') || '1.5';
          group.dataset.originalFill = group.getAttribute('fill') || 'none';

          const existingLabel = group.querySelector('text[data-pickerfox-label]');
          if (existingLabel) existingLabel.remove();

          const text = document.createElementNS(svgNS, 'text');
          text.setAttribute('data-pickerfox-label', 'true');
          text.setAttribute('x', '0.6');
          text.setAttribute('y', '0.48');
          text.setAttribute('text-anchor', 'middle');
          text.setAttribute('font-size', '0.28');
          text.setAttribute('font-family', 'Arial, sans-serif');
          text.setAttribute('font-weight', '700');
          text.setAttribute('fill', '#2e3a4f');
          text.textContent = String(item.product);
          group.appendChild(text);
        });

        palletGroups = groups;
      }

      function handleSearch() {
        const value = Number(input.value);

        if (!Number.isInteger(value) || value < 1 || value > 100) {
          status.textContent = 'No product selected';
          result.className = 'result';
          result.innerHTML = '<div class="meta">Select a product number to highlight its pallet on the map.</div>';
          resetSelectionVisuals();
          return;
        }

        setSelectedProduct(value);
      }

      warehouseSvg.addEventListener('load', () => {
        attachProductData();
        buildDatalist();
      });

      input.addEventListener('change', handleSearch);
      input.addEventListener('input', () => {
        if (input.value === '') {
          status.textContent = 'No product selected';
          result.className = 'result';
          result.innerHTML = '<div class="meta">Select a product number to highlight its pallet on the map.</div>';
          resetSelectionVisuals();
        }
      });

      clearBtn.addEventListener('click', () => {
        input.value = '';
        resetSelectionVisuals();
        status.textContent = 'No product selected';
        result.className = 'result';
        result.innerHTML = '<div class="meta">Select a product number to highlight its pallet on the map.</div>';
      });

      buildDatalist();
    </script>
  </body>
</html>

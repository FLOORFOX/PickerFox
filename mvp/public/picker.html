<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#182233">
    <title>PickerFox Picker</title>
    <link rel="stylesheet" href="./shared.css?v=__BUILD__">
    <script src="./vendor/peerjs.min.js?v=__BUILD__"></script>
    <style>
      body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none; }
      #mapwrap { position: relative; flex: 1; min-height: 0; }
      #map { position: absolute; inset: 0; }
      .grow { flex: 1; min-width: 0; }

      .top { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 8px; align-items: center; pointer-events: none; }
      .top > * { pointer-events: auto; }
      .chip {
        display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; max-width: 100%;
        border: 1px solid rgba(24, 34, 51, 0.18); border-radius: 20px; background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 2px 8px rgba(24, 34, 51, 0.14); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #roomBadge { cursor: default; font-weight: 600; padding: 0 10px; min-width: 0; }
      #roomBadge.on { color: #05603a; background: #d1fadf; border-color: #a6f4c5; }
      #roomBadge.off { color: #93370d; background: #fef0c7; border-color: #fedf89; }
      #q { flex: 1; min-width: 0; height: 40px; padding: 0 14px; font-size: 16px; border: 1px solid rgba(24, 34, 51, 0.25); border-radius: 20px; background: #fff; box-shadow: 0 2px 8px rgba(24, 34, 51, 0.14); }
      #results {
        position: absolute; top: 54px; left: 8px; right: 8px; max-height: 60%; overflow: auto; margin: 0; padding: 4px; list-style: none;
        border: 1px solid var(--line); border-radius: 12px; background: #fff; box-shadow: 0 8px 24px rgba(24, 34, 51, 0.2);
      }
      #results button { display: grid; gap: 2px; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: none; text-align: left; cursor: pointer; }
      #results button:active { background: #eef4ff; }
      #results .none { padding: 10px; }

      .zoom { position: absolute; right: 8px; top: 58px; display: grid; gap: 6px; opacity: 0.85; }
      .zoom button { width: 36px; height: 36px; border: 1px solid rgba(24, 34, 51, 0.18); border-radius: 8px; background: #fff; font-size: 1.15rem; line-height: 1; cursor: pointer; }

      #card {
        position: absolute; left: 8px; right: 8px; bottom: 8px; max-height: 58%; overflow: auto; padding: 12px;
        border: 1px solid var(--line); border-radius: 14px; background: rgba(255, 255, 255, 0.97); box-shadow: 0 8px 24px rgba(24, 34, 51, 0.22);
      }
      #card h3 { margin-right: 36px; font-size: 1.05rem; }
      #card .x { position: absolute; top: 6px; right: 6px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: none; font-size: 1.5rem; line-height: 1; cursor: pointer; }
      #card .where { margin-top: 6px; font-weight: 600; }
      #card .where span { font-weight: 400; }
      #card .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
      #card .actions .btn { min-height: 40px; }
      #card ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
      #card .front { margin-top: 10px; }
      #card .slot { min-height: 34px; }
      .report { min-width: 40px; font-weight: 800; color: #9a3412; border-color: #f5c6a5; background: #fff7f0; }

      #sheet { flex: none; border-top: 1px solid var(--line); background: #fff; box-shadow: 0 -4px 14px rgba(24, 34, 51, 0.1); padding-bottom: env(safe-area-inset-bottom); }
      #handle { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 8px 14px; border: 0; background: none; text-align: left; cursor: pointer; }
      #handle .grow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #sheetBody { max-height: 46vh; max-height: 46dvh; overflow: auto; padding: 0 10px 10px; }
      .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; }
      .listchip { display: inline-flex; align-items: center; gap: 6px; flex: none; padding: 4px 10px 4px 4px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; cursor: pointer; }
      .listchip.active { border-color: var(--text); background: #f1f3f7; font-weight: 600; }
      .lines { margin: 0; padding: 0; list-style: none; }
      .line { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-top: 1px solid var(--line); cursor: pointer; }
      .line.cur { background: #eef4ff; }
      .line.picked .nm { text-decoration: line-through; color: var(--muted); }
      .short { color: #b42318; font-weight: 600; }
      .check { flex: none; width: 40px; height: 40px; border: 2px solid #98a2b3; border-radius: 10px; background: #fff; font-size: 1.3rem; line-height: 1; cursor: pointer; }
      .line.picked .check { border-color: #067647; background: #067647; color: #fff; }
      .done-note { padding: 10px 4px; font-weight: 600; color: #067647; }
      .modal-card .btn { min-height: 46px; font-size: 1.02rem; }
    </style>
  </head>
  <body>
    <div id="mapwrap">
      <div id="map"></div>
      <div class="top">
        <button id="who" class="chip" type="button" aria-label="Account and picker"><span class="dot" id="conn"></span><span id="whoName">…</span></button>
        <span id="roomBadge" class="chip small" hidden></span>
        <button id="searchToggle" class="chip" type="button" aria-label="Search products" aria-expanded="false">🔍</button>
        <input id="q" type="search" placeholder="Product name or SKU" aria-label="Search products" autocomplete="off" hidden>
      </div>
      <ul id="results" hidden></ul>
      <div class="zoom">
        <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
        <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
        <button id="zoomReset" type="button" aria-label="Show whole warehouse">⤢</button>
      </div>
      <div id="card" hidden></div>
    </div>
    <section id="sheet" aria-label="Pick list">
      <button id="handle" type="button" aria-expanded="false"></button>
      <div id="sheetBody" hidden></div>
    </section>

    <div id="loginModal" class="modal-backdrop" hidden>
      <form id="login" class="modal-card form">
        <h3>Log in to the manager's room</h3>
        <label>Username<input id="username" autocomplete="username" autocapitalize="none" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <div id="loginError" class="error" hidden></div>
        <button class="btn primary" type="submit">Log in</button>
      </form>
    </div>

    <div id="accountModal" class="modal-backdrop" hidden>
      <div class="modal-card" id="accountBox"></div>
    </div>

    <div id="issueModal" class="modal-backdrop" hidden>
      <form id="issueForm" class="modal-card form">
        <div class="modal-head"><h3>Report a problem</h3><button class="modal-x" data-close type="button" aria-label="Close">×</button></div>
        <div class="small muted" id="issueWhat"></div>
        <div class="choice" id="issueTypes"></div>
        <label>Note (optional)<textarea id="issueNote" rows="2" maxlength="300"></textarea></label>
        <button class="btn primary" type="submit">Send report</button>
      </form>
    </div>

    <script src="./shared.js?v=__BUILD__"></script>
    <script>
      const $ = id => document.getElementById(id);
      const { esc } = PF;
      const params = new URLSearchParams(location.search);
      const room = params.get('room');
      // Without a room the picker works on this browser's data and needs a local login.
      let session = room ? PF.currentUser() : PF.requireRole(['admin', 'user']);
      let state;
      let ix;
      let map;
      let mapReady;
      let me = null;
      let activeId = localStorage.getItem('pf.list');
      let sel = null; // { productId, line?, listId? } or { elementId }
      let sheetOpen = false;
      let frontOpen = false;
      let knownLists = null;
      let issueTarget = null;
      let peerClient = null;

      function choosePicker() {
        if (!session) return;
        if (session.role === 'user') me = session.pickerId;
        else me = params.get('picker') || localStorage.getItem('pf.picker') || me;
      }

      const myLists = () => state.picklists.filter(l => l.pickerId === me);

      function activeList() {
        const lists = myLists();
        return lists.find(l => l.id === activeId) || lists.find(l => PF.status(l) !== 'Done') || lists[0] || null;
      }

      function selectedElements() {
        if (!sel) return new Set();
        if (sel.elementId) return new Set([sel.elementId]);
        return new Set(PF.locations(ix, sel.productId).map(s => s.elementId));
      }

      const selectedLine = list => (sel && list && sel.listId === list.id ? list.lines[sel.line] : null);

      function paint() {
        if (!map) return;
        const list = activeList();
        map.paint({
          stocked: new Set(ix.stockByElement.keys()),
          marks: list ? PF.listMarks(ix, list) : new Map(),
          selected: selectedElements(),
        });
      }

      function render() {
        if (!state) return;
        const picker = ix.pickers.get(me);
        $('whoName').textContent = picker ? picker.name : session ? session.username : 'Log in';
        renderSheet();
        renderCard();
        renderAccount();
        paint();
      }

      function renderAccount() {
        const box = $('accountBox');
        if (!session) {
          box.innerHTML = '';
          return;
        }
        const admin = session.role === 'admin';
        const pickers = admin ? state.pickers.map(p => {
          const count = state.picklists.filter(l => l.pickerId === p.id && PF.status(l) !== 'Done').length;
          const badge = count ? ` <b>(${count} list${count > 1 ? 's' : ''} waiting)</b>` : ' <span class="muted">(0 lists)</span>';
          return `<button class="btn${p.id === me ? ' primary' : ''}" type="button" data-picker="${p.id}">${esc(p.name)}${badge}</button>`;
        }).join('') : '';
        box.innerHTML = `<div class="modal-head"><h3>${esc(session.username)} <span class="small muted">${admin ? 'admin' : 'picker'}</span></h3><button class="modal-x" data-close type="button" aria-label="Close">×</button></div>
          ${admin ? `<div class="small muted">Pick as</div>${pickers}` : ''}
          ${admin && !room ? '<a class="btn" href="./index.html" style="text-align:center;text-decoration:none;color:inherit;">All interfaces</a>' : ''}
          <button class="btn" type="button" data-logout>Log out</button>
          <button class="btn" type="button" data-clear-data>Clear saved data</button>`;
      }

      function renderSheet() {
        const list = activeList();
        const lists = myLists();
        const handle = $('handle');
        const body = $('sheetBody');
        handle.setAttribute('aria-expanded', String(sheetOpen));
        body.hidden = !sheetOpen;
        if (!list) {
          const otherActive = session?.role === 'admin' ? state.picklists.filter(l => PF.status(l) !== 'Done' && l.pickerId) : [];
          if (otherActive.length) {
            const firstOther = otherActive[0];
            const otherName = esc(ix.pickers.get(firstOther.pickerId)?.name || 'another picker');
            handle.innerHTML = `<span class="grow" style="color:#b45309;">${PF.swatch(firstOther)} List ${firstOther.number} assigned to <b>${otherName}</b> · Tap to switch</span>`;
            body.innerHTML = `
              <div style="padding:14px;background:#fef3c7;border-radius:12px;margin:8px 0;display:grid;gap:8px;">
                <div><b>List ${firstOther.number} (${esc(firstOther.customer)})</b> is assigned to <b>${otherName}</b>.</div>
                <button type="button" class="btn primary" data-switch-picker="${firstOther.pickerId}">Pick as ${otherName}</button>
              </div>`;
            return;
          }
          handle.innerHTML = `<span class="grow muted">${me ? 'No pick list assigned' : 'Not linked to a picker'}</span>`;
          body.innerHTML = `<p class="muted">${me ? 'Lists assigned by a manager appear here automatically.' : 'Ask an admin to link your account to a picker.'}</p>`;
          return;
        }
        const { done, total } = PF.progress(list);
        handle.innerHTML = `${PF.swatch(list)}<span class="grow"><b>List ${list.number}</b> · ${esc(list.customer)}</span><span>${done}/${total}</span><span aria-hidden="true">${sheetOpen ? '▾' : '▴'}</span>`;
        const chips = lists.length > 1
          ? `<div class="chips">${lists.map(l => {
            const p = PF.progress(l);
            return `<button type="button" class="listchip${l.id === list.id ? ' active' : ''}" data-list="${l.id}">${PF.swatch(l)}<span>${esc(l.customer)} ${p.done}/${p.total}</span></button>`;
          }).join('')}</div>`
          : '';
        const lines = list.lines.map((line, i) => {
          const p = ix.products.get(line.productId);
          const current = selectedLine(list) === line;
          return `<li class="line${line.picked ? ' picked' : ''}${current ? ' cur' : ''}" data-line="${i}">
            <button type="button" class="check" data-check="${i}" aria-pressed="${line.picked}" aria-label="Picked: ${esc(p?.name)}">${line.picked ? '✓' : ''}</button>
            <div class="grow"><div class="nm"><b>${line.qty} ×</b> ${esc(p?.name)}</div><div class="small muted">${p?.sku} · ${esc(PF.addresses(ix, line.productId))}${line.short > 0 ? ` · <span class="short">short ${line.short}</span>` : ''}</div></div>
          </li>`;
        }).join('');
        body.innerHTML = `${chips}${done === total ? '<div class="done-note">✓ List complete</div>' : ''}<ul class="lines">${lines}</ul>`;
      }

      function renderCard() {
        const card = $('card');
        card.hidden = !sel;
        if (!sel) return;
        const list = activeList();
        const fronts = [];
        let html = '<button class="x" type="button" data-close aria-label="Close">×</button>';
        if (sel.elementId) {
          const el = ix.elements.get(sel.elementId);
          if (!el) { sel = null; card.hidden = true; return; }
          const entries = ix.stockByElement.get(el.id) || [];
          const wanted = new Set(list ? list.lines.filter(l => !l.picked).map(l => l.productId) : []);
          html += `<h3>${el.type === 'rack' ? 'Rack' : 'Pallet'} ${el.code}</h3>`;
          html += entries.length
            ? `<ul>${entries.map(s => {
              const p = ix.products.get(s.productId);
              return `<li><b>${s.qty}</b> × ${esc(p.name)} <span class="small muted">${p.sku}${el.type === 'rack' ? ` · B${s.bay} · L${s.level}` : ''}</span>${wanted.has(p.id) ? ` ${PF.swatch(list)}` : ''}</li>`;
            }).join('')}</ul>`
            : '<p class="muted">Nothing stored here.</p>';
          html += '<div class="actions"><span class="grow"></span><button class="btn report" type="button" data-report aria-label="Report a problem here">!</button></div>';
          fronts.push({ el, hot: wanted });
        } else {
          const p = ix.products.get(sel.productId);
          const locs = PF.locations(ix, p.id);
          const line = selectedLine(list);
          html += `<h3>${esc(p.name)}</h3><div class="small muted">${p.sku} · ${p.mfrSku} · Carton: ${esc(p.cartonLabel)}</div>`;
          html += locs.length
            ? locs.map(s => `<div class="where">📍 ${PF.address(ix, s)} <span class="muted">· ${s.qty} cartons</span></div>`).join('')
            : '<div class="where">No location recorded</div>';
          const shared = locs.flatMap(s => (ix.stockByElement.get(s.elementId) || [])
            .filter(o => o.bay === s.bay && o.level === s.level && o.productId !== p.id)
            .map(o => ({ ...o, product: ix.products.get(o.productId) })));
          if (shared.length) {
            html += `<div class="small muted" style="margin-top:6px;padding:4px 8px;border-radius:6px;background:#f5f3ec;border:1px solid #e5dfd0;">
              <b>Also in this slot:</b> ${shared.map(o => `${o.qty} × ${esc(o.product.name)}`).join(', ')}
            </div>`;
          }
          html += '<div class="actions">';
          if (line) {
            html += `${PF.swatch(list)}<b>Pick ${line.qty}</b>${line.short > 0 ? `<span class="short">short ${line.short}</span>` : ''}<span class="grow"></span><button class="btn${line.picked ? '' : ' primary'}" type="button" data-pick>${line.picked ? 'Undo picked' : 'Picked ✓'}</button>`;
          } else {
            html += '<span class="grow"></span>';
          }
          if (locs.length) html += `<button class="btn" type="button" data-front>${frontOpen ? 'Hide' : 'Show'} front view</button>`;
          html += '<button class="btn report" type="button" data-report aria-label="Report a problem with this product">!</button>';
          html += '</div>';
          if (frontOpen) new Set(locs.map(s => s.elementId)).forEach(id => fronts.push({ el: ix.elements.get(id), hot: new Set([p.id]) }));
        }
        card.innerHTML = html;
        fronts.forEach(f => card.appendChild(PF.frontView(ix, f.el, { hot: f.hot })));
      }

      function selectProduct(productId, line) {
        const list = activeList();
        sel = line === undefined ? { productId } : { productId, line, listId: list.id };
        frontOpen = false;
        // The card carries the pick from here, so the list gives the map its space back.
        sheetOpen = false;
        render();
        map?.focus(selectedElements(), ($('card').offsetHeight + 16) / $('mapwrap').clientHeight);
      }

      function setPicked(index, picked, advance = false) {
        const list = activeList();
        const line = list?.lines[index];
        if (!line) return;
        if (picked && advance) {
          const order = list.lines.map((_, i) => (index + 1 + i) % list.lines.length);
          const next = order.find(i => i !== index && !list.lines[i].picked);
          if (next === undefined) {
            sel = null;
            PF.toast(`List ${list.number} complete`);
          } else {
            selectProduct(list.lines[next].productId, next);
          }
        }
        PF.post(`/api/picklists/${list.id}/pick`, { line: index, picked });
      }

      function openIssue() {
        if (!sel) return;
        if (sel.elementId) {
          const el = ix.elements.get(sel.elementId);
          issueTarget = { elementId: el.id, bay: 1, level: 1, productId: null };
          $('issueWhat').textContent = `${el.type === 'rack' ? 'Rack' : 'Pallet'} ${el.code}`;
        } else {
          const product = ix.products.get(sel.productId);
          const loc = PF.locations(ix, product.id)[0];
          issueTarget = { productId: product.id, elementId: loc?.elementId || null, bay: loc?.bay || null, level: loc?.level || null };
          $('issueWhat').textContent = `${product.name}${loc ? ` · ${PF.address(ix, loc)}` : ''}`;
        }
        $('issueTypes').innerHTML = Object.entries(PF.ISSUE_TYPES).map(([key, label], i) => `<label><input type="radio" name="issueType" value="${key}"${i === 0 ? ' checked' : ''}> ${label}</label>`).join('');
        $('issueNote').value = '';
        $('issueModal').hidden = false;
      }

      $('issueForm').addEventListener('submit', async event => {
        event.preventDefault();
        const type = new FormData(event.target).get('issueType');
        $('issueModal').hidden = true;
        const result = await PF.post('/api/issues', { ...issueTarget, type, note: $('issueNote').value.trim(), by: session?.username || null });
        if (result) PF.toast('Report sent to the managers');
      });

      $('handle').addEventListener('click', () => { sheetOpen = !sheetOpen; render(); });

      $('sheetBody').addEventListener('click', event => {
        const switchBtn = event.target.closest('[data-switch-picker]');
        if (switchBtn) {
          me = switchBtn.dataset.switchPicker;
          localStorage.setItem('pf.picker', me);
          sel = null;
          render();
          return;
        }
        const check = event.target.closest('[data-check]');
        const chip = event.target.closest('[data-list]');
        const line = event.target.closest('[data-line]');
        const list = activeList();
        if (check) {
          const index = Number(check.dataset.check);
          setPicked(index, !list.lines[index].picked);
        } else if (chip) {
          activeId = chip.dataset.list;
          localStorage.setItem('pf.list', activeId);
          sel = null;
          render();
        } else if (line) {
          const index = Number(line.dataset.line);
          selectProduct(list.lines[index].productId, index);
        }
      });

      $('card').addEventListener('click', event => {
        if (event.target.closest('[data-close]')) {
          sel = null;
        } else if (event.target.closest('[data-pick]')) {
          const line = selectedLine(activeList());
          if (line) setPicked(sel.line, !line.picked, true);
          return;
        } else if (event.target.closest('[data-front]')) {
          frontOpen = !frontOpen;
        } else if (event.target.closest('[data-report]')) {
          openIssue();
          return;
        } else {
          return;
        }
        render();
      });

      function renderResults() {
        const query = $('q').value.trim().toLowerCase();
        const box = $('results');
        box.hidden = !query;
        if (!query || !state) return;
        const hits = state.products.filter(p => [p.name, p.sku, p.mfrSku, p.cartonLabel].some(v => v.toLowerCase().includes(query))).slice(0, 8);
        box.innerHTML = hits.length
          ? hits.map(p => `<li><button type="button" data-product="${p.id}"><b>${esc(p.name)}</b><span class="small muted">${p.sku} · ${esc(PF.addresses(ix, p.id))}</span></button></li>`).join('')
          : '<li class="none muted">No product found</li>';
      }

      $('q').addEventListener('input', renderResults);
      $('q').addEventListener('focus', renderResults);
      $('results').addEventListener('click', event => {
        const hit = event.target.closest('[data-product]');
        if (!hit) return;
        $('results').hidden = true;
        $('q').blur();
        selectProduct(hit.dataset.product);
      });
      $('searchToggle').addEventListener('click', () => {
        const input = $('q');
        input.hidden = !input.hidden;
        $('searchToggle').setAttribute('aria-expanded', String(!input.hidden));
        input.value = '';
        $('results').hidden = true;
        if (!input.hidden) input.focus();
      });

      $('who').addEventListener('click', () => {
        if (!session) { $('loginModal').hidden = false; return; }
        renderAccount();
        $('accountModal').hidden = false;
      });
      document.querySelectorAll('.modal-backdrop').forEach(modal => modal.addEventListener('click', event => {
        if (modal.id === 'loginModal') return;
        if (event.target === modal || event.target.closest('[data-close]')) modal.hidden = true;
      }));
      $('accountBox').addEventListener('click', event => {
        if (event.target.closest('[data-clear-data]')) {
          if (confirm('Clear the data saved on this device and reload? You are logged out.')) PF.clearSavedData();
          return;
        }
        if (event.target.closest('[data-logout]')) {
          peerClient?.close();
          if (room) {
            try { localStorage.removeItem('pf.session'); } catch {}
            location.reload();
          } else {
            PF.logout();
          }
          return;
        }
        const choice = event.target.closest('[data-picker]');
        if (!choice) return;
        me = choice.dataset.picker;
        localStorage.setItem('pf.picker', me);
        $('accountModal').hidden = true;
        sel = null;
        knownLists = new Set(myLists().map(l => l.id));
        render();
      });

      $('zoomIn').addEventListener('click', () => map?.zoom(1.5));
      $('zoomOut').addEventListener('click', () => map?.zoom(1 / 1.5));
      $('zoomReset').addEventListener('click', () => map?.reset());

      function applyState(next) {
        state = next;
        ix = PF.index(state);
        map?.updateElements(state.elements);
        if (sel && sel.listId && !myLists().some(l => l.id === sel.listId)) sel = null;
        const mine = myLists();
        if (knownLists) {
          const fresh = mine.filter(l => !knownLists.has(l.id));
          if (fresh.length) PF.toast(`New pick list ${fresh.map(l => l.number).join(', ')} assigned to you`);
        }
        knownLists = new Set(mine.map(l => l.id));
        mapReady ||= PF.createMap($('map'), state, {
          onSelect: id => { sel = id ? { elementId: id } : null; if (id) sheetOpen = false; render(); },
        }).then(created => { map = created; paint(); });
        render();
      }

      function badge(online, text) {
        $('conn').classList.toggle('on', online);
        const node = $('roomBadge');
        node.hidden = false;
        node.className = `chip small ${online ? 'on' : 'off'}`;
        node.textContent = online ? `🟢 ${room.slice(0, 6)}` : `🟡 ${text || 'Connecting…'}`;
      }

      function joinRoom(credentials) {
        peerClient?.close();
        peerClient = PF.connectPeerClient({
          roomCode: room,
          credentials,
          onWelcome: user => {
            session = PF.setSession(user, credentials.passHash);
            $('loginModal').hidden = true;
            choosePicker();
          },
          onDenied: reason => {
            try { localStorage.removeItem('pf.session'); } catch {}
            session = null;
            badge(false, 'Not logged in');
            $('loginError').textContent = reason || 'Wrong username or password';
            $('loginError').hidden = false;
            $('loginModal').hidden = false;
          },
          onState: applyState,
          onStatus: (online, text) => {
            badge(online, text);
            if (online) PF.toast(text);
          },
        });
      }

      $('login').addEventListener('submit', async event => {
        event.preventDefault();
        $('loginError').hidden = true;
        joinRoom({ username: $('username').value.trim(), passHash: await PF.sha256($('password').value) });
      });

      if (room) {
        // The manager checks the login; this phone works on the manager's data.
        badge(false, 'Not logged in');
        if (session) joinRoom({ username: session.username, passHash: session.passHash });
        else $('loginModal').hidden = false;
      } else if (session) {
        choosePicker();
        PF.connect(next => {
          PF.checkSession(next);
          applyState(next);
        }, online => $('conn').classList.toggle('on', online));
      }
    </script>
  </body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="PickerFox management dashboard mockup">
  <title>Dashboard mockup</title>
  <desc>Management dashboard with KPIs, recent alerts, and heatmap preview.</desc>
  <rect width="100%" height="100%" fill="#f6f7fb"/>
  <rect x="40" y="20" width="1120" height="80" fill="#fff" stroke="#e6e9ef" rx="8"/>
  <text x="60" y="68" font-size="28" fill="#2b2b2b">Dashboard — PickerFox</text>
  <g transform="translate(60,120)">
    <rect x="0" y="0" width="240" height="120" fill="#fff" stroke="#e6e9ef" rx="8"/>
    <text x="20" y="30" font-size="14" fill="#777">Avg pick time</text>
    <text x="20" y="70" font-size="28" fill="#2b2b2b">1m 42s</text>
    <rect x="280" y="0" width="240" height="120" fill="#fff" stroke="#e6e9ef" rx="8"/>
    <text x="300" y="30" font-size="14" fill="#777">Today picks</text>
    <text x="300" y="70" font-size="28" fill="#2b2b2b">1,234</text>
    <rect x="560" y="0" width="240" height="120" fill="#fff" stroke="#e6e9ef" rx="8"/>
    <text x="580" y="30" font-size="14" fill="#777">Active pickers</text>
    <text x="580" y="70" font-size="28" fill="#2b2b2b">12</text>
  </g>
  <g transform="translate(60,260)">
    <rect x="0" y="0" width="740" height="300" fill="#fff" stroke="#e6e9ef" rx="8"/>
    <text x="20" y="30" font-size="16" fill="#2b2b2b">Pick throughput (last 24h)</text>
    <polyline points="40,260 120,220 200,180 280,160 360,140 440,160 520,130 600,110 700,120" fill="none" stroke="#4a90e2" stroke-width="3"/>
  </g>
  <rect x="840" y="260" width="320" height="220" fill="#fff" stroke="#e6e9ef" rx="8"/>
  <text x="860" y="290" font-size="16" fill="#2b2b2b">Heatmap preview</text>
  <g transform="translate(860,310)">
    <rect width="280" height="150" fill="#f8fbff" stroke="#e6ebf6"/>
    <g opacity="0.85">
      <rect x="20" y="18" width="56" height="46" fill="#ff6f3c"/>
      <rect x="85" y="42" width="58" height="44" fill="#ffbd80"/>
      <rect x="150" y="25" width="42" height="54" fill="#ffe8d6"/>
      <rect x="198" y="60" width="64" height="42" fill="#ffbd80"/>
      <rect x="40" y="88" width="94" height="34" fill="#ffefdf"/>
      <rect x="150" y="92" width="82" height="27" fill="#ffeee0"/>
    </g>
  </g>
  <rect x="60" y="580" width="1100" height="80" fill="#fff" stroke="#e6e9ef" rx="8"/>
  <text x="80" y="612" font-size="14" fill="#2b2b2b">Recent alerts: 3 missing locations, 5 inconsistent counts, 1 high-traffic area</text>
</svg>
